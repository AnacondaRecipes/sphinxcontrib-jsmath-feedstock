{% set name = "sphinxcontrib-jsmath" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.replace('-', '_') }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 551f780cf9687f9c3c74f0cf9f18aca06e0d6958853453f3803fe4d357c5b924

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.7
  run:
    - python
  run_constrained:
    - sphinx >=5

test:
  requires:
    # This is a circular dependency b/c sphinx depends on this package now :-/
    - sphinx >=2
    - python
    - pip
  imports:
    - sphinxcontrib
    - sphinxcontrib.jsmath
  commands:
    - pip check

about:
  home: https://www.sphinx-doc.org
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENCE.rst
  summary: A sphinx extension which renders display math in HTML via JavaScript
  description: |
    A sphinx extension which renders display math in HTML via JavaScript.
  doc_url: https://www.sphinx-doc.org
  dev_url: https://github.com/sphinx-doc/sphinxcontrib-jsmath

extra:
  recipe-maintainers:
    - ocefpaf
