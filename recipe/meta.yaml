{% set version = "2.0.0" %}

package:
  name: sphinxcontrib-jsmath
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinxcontrib-jsmath/sphinxcontrib_jsmath-2.0.0.tar.gz
  sha256: 551f780cf9687f9c3c74f0cf9f18aca06e0d6958853453f3803fe4d357c5b924

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.7
  run:
    - python
  run_constrained:
    - Sphinx >=5

test:
  requires:
    # This is a circular dependency b/c sphinx depends on this package now :-/
    - sphinx >=2
    - python
  imports:
    - sphinxcontrib
    - sphinxcontrib.jsmath
  commands:
    - pip check

about:
  home: https://sphinx-doc.org/
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A sphinx extension which renders display math in HTML via JavaScript

extra:
  recipe-maintainers:
    - ocefpaf
